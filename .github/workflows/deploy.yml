name: Validate & Deploy NFP Fleet

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Configure private Jarvis flake access
        env:
          JARVIS_TOKEN: ${{ secrets.JARVIS_TOKEN }}
        run: |
          if [ -n "${JARVIS_TOKEN:-}" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=${JARVIS_TOKEN}" >> "$GITHUB_ENV"
          fi
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check git author identity
        run: |
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          if [[ "$AUTHOR_EMAIL" =~ .*@example\.com$ ]]; then
            echo "Error: HEAD commit author email uses placeholder @example.com: $AUTHOR_EMAIL"
            exit 1
          fi
      - name: Check clean-state-checklist.md hygiene
        run: |
          if grep -q '\[x\]' clean-state-checklist.md; then
            echo "Error: clean-state-checklist.md on main contains checked items [x]! It must remain an unchecked template on main."
            exit 1
          fi
      - name: Check flake format
        run: nix fmt -- --fail-on-change
      - name: Check agent alias symlinks
        run: |
          test -L CLAUDE.md && test -L GEMINI.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"
          test "$(readlink GEMINI.md)" = "AGENTS.md"
      - name: Validate feature_list.json schema v2
        run: jq -e '.features | all(has("id") and has("verification") and has("state") and has("claimedBy") and has("blockedReason") and (.evidence | all(type == "object" and has("sha") and has("command") and has("output") and has("at"))))' feature_list.json
      - name: Evaluate fleet host configurations
        run: |
          for host in luffy sanji z0r0; do
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" > /dev/null
          done
      - name: Run non-VM flake checks
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.treefmt \
            .#checks.x86_64-linux.feature-list-schema \
            .#checks.x86_64-linux.docs-drift \
            .#checks.x86_64-linux.bogus-tag-negative-test \
            .#checks.x86_64-linux.homepage-lovable-archived \
            .#checks.x86_64-linux.mcp-containment-check \
            .#checks.x86_64-linux.mcp-registry-type-check \
            .#checks.x86_64-linux.mcp-nixos-authority-check \
            .#checks.x86_64-linux.executor-pilot-check \
            .#checks.x86_64-linux.mcp-client-migration-check \
            .#checks.x86_64-linux.mcp-context-budget-check \
            .#checks.x86_64-linux.luffy-service-scope \
            .#checks.x86_64-linux.llm-agents-catalog-completeness \
            .#checks.x86_64-linux.dendritic-structure-test \
            .#checks.x86_64-linux.noctalia-registry-check \
            .#checks.x86_64-linux.nfp-motd-test \
            .#checks.x86_64-linux.homepage-contract-coverage \
            .#checks.x86_64-linux.layer-numbering-check \
            .#checks.x86_64-linux.tailnet-dns-guard \
            .#checks.x86_64-linux.bare-nami-hostname-check

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, nixos, deployer]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Jarvis flake access
        env:
          JARVIS_TOKEN: ${{ secrets.JARVIS_TOKEN }}
        run: |
          if [ -n "${JARVIS_TOKEN:-}" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=${JARVIS_TOKEN}" >> "$GITHUB_ENV"
          fi
      - name: Full flake & VM test check
        run: nix flake check --option builders ""
      - name: Deploy entire fleet
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 "$CREDENTIALS_DIRECTORY/ci-deploy-ssh-key" "$HOME/.ssh/id_ed25519"
          self=$(uname -n)
          for host in sanji luffy z0r0; do
            if [ "$host" != "$self" ]; then
              clan machines update --host-key-check accept-new --build-host localhost --option builders "" "$host"
            fi
          done
          clan machines update --host-key-check accept-new --build-host localhost --option builders "" "$self"
