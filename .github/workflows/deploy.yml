name: Validate & Deploy NFP Fleet

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check git author identity
        run: |
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          if [[ "$AUTHOR_EMAIL" =~ .*@example\.com$ ]]; then
            echo "Error: HEAD commit author email uses placeholder @example.com: $AUTHOR_EMAIL"
            exit 1
          fi
      - name: Check clean-state-checklist.md hygiene
        run: |
          if grep -q '\[x\]' clean-state-checklist.md; then
            echo "Error: clean-state-checklist.md on main contains checked items [x]! It must remain an unchecked template on main."
            exit 1
          fi
      - name: Check flake format
        run: nix fmt -- --fail-on-change
      - name: Check agent alias symlinks
        run: |
          test -L CLAUDE.md && test -L GEMINI.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"
          test "$(readlink GEMINI.md)" = "AGENTS.md"
      - name: Validate feature_list.json schema v2
        run: jq -e '.features | all(has("id") and has("verification") and has("state") and has("claimedBy") and has("blockedReason") and (.evidence | all(type == "object" and has("sha") and has("command") and has("output") and has("at"))))' feature_list.json
      - name: Flake check
        run: nix flake check

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, nixos, deployer]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Deploy entire fleet
        run: clan machines update
