version: "3.9"
# Target 3: Podman / Docker Container Appliance Stack (Synology / Unraid / Existing Linux)
services:
  extremerouter:
    image: docker.io/rsalmn/extremerouter:latest
    container_name: jarvis-extremerouter
    ports:
      - "20128:20128"
    environment:
      ENABLE_RTK: "true"
      ENABLE_HEADROOM: "true"
      ENABLE_CAVEMAN: "true"
    volumes:
      - jarvis_state:/var/lib/jarvis
    restart: unless-stopped

  jev-proxy:
    image: python:3.12-slim
    container_name: jarvis-jev-proxy
    ports:
      - "20127:20127"
    volumes:
      - jarvis_state:/var/lib/jarvis
    restart: unless-stopped

  pwa-command-center:
    image: python:3.12-slim
    container_name: jarvis-pwa-command-center
    ports:
      - "8096:8096"
    volumes:
      - jarvis_state:/var/lib/jarvis
    restart: unless-stopped

volumes:
  jarvis_state:
